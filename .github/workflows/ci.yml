name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-linux:
    name: Linux — lint, type, and test
    runs-on: [self-hosted, Linux, X64, vitaminbot]
    timeout-minutes: 10
    env:
      PGHOST: /var/run/postgresql
      PGPORT: "55432"
      PGUSER: nt5user

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Verify bounded PostgreSQL integration service
        shell: bash
        run: |
          set -euo pipefail

          pg_isready -h "$PGHOST" -p "$PGPORT" -d postgres

          current_user="$(
            psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres               -Atqc "SELECT current_user"
          )"
          test "$current_user" = "$PGUSER"

          role_flags="$(
            psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres               -At -F '|'               -c "SELECT rolsuper, rolcreaterole, rolcreatedb, rolreplication, rolbypassrls FROM pg_roles WHERE rolname = current_user"
          )"
          if [[ "$role_flags" != "f|f|t|f|f" ]]; then
            echo "Unexpected PostgreSQL CI role privileges: $role_flags" >&2
            exit 1
          fi

          test -S "$PGHOST/.s.PGSQL.$PGPORT"
          if ss -ltn | awk '{print $4}' | grep -Eq '(^|:)55432$'; then
            echo "PostgreSQL CI port must not have a TCP listener" >&2
            exit 1
          fi

      - name: Create isolated PostgreSQL test database
        shell: bash
        run: |
          set -euo pipefail

          database_name="vitaminbot_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          dropdb             --if-exists             --force             -h "$PGHOST"             -p "$PGPORT"             -U "$PGUSER"             "$database_name"
          createdb             -h "$PGHOST"             -p "$PGPORT"             -U "$PGUSER"             "$database_name"

          {
            echo "POSTGRES_TEST_DB=$database_name"
            echo "DATABASE_URL=dbname=$database_name user=$PGUSER host=$PGHOST port=$PGPORT"
          } >> "$GITHUB_ENV"

      - name: Pytest
        run: pytest

      - name: Drop isolated PostgreSQL test database
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${POSTGRES_TEST_DB:-}" ]]; then
            dropdb               --if-exists               --force               -h "$PGHOST"               -p "$PGPORT"               -U "$PGUSER"               "$POSTGRES_TEST_DB"
          fi

  compatibility-windows:
    name: Windows — compatibility (non-blocking)
    runs-on: [self-hosted, Windows, X64, vitaminbot]
    timeout-minutes: 10
    continue-on-error: true
    env:
      PSExecutionPolicyPreference: Bypass

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest
