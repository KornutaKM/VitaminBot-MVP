name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-linux:
    name: Linux — lint, type, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitaminbot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vitaminbot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vitaminbot_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Verify PostgreSQL service
        shell: bash
        run: |
          python - <<'PY'
          import os

          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              assert conn.execute("SELECT 1").fetchone() == (1,)
          PY

      - name: Pytest
        run: pytest

      - name: V03 release journeys
        run: >-
          pytest -q
          tests/test_v03_quick_add_renderer.py
          tests/test_v03_today_renderer.py
          tests/test_v03_supplement_detail.py
          tests/test_v03_inventory.py
          tests/test_v03_adherence.py
          tests/test_v03_account_data.py
          tests/test_v03_observability.py
          tests/test_kir120_integration.py

  safety-regression-linux:
    name: Safety regression — ENG4 independent suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run independent safety regression suite
        run: pytest -q tests/test_safety_regression_kir121.py

  compatibility-windows:
    name: Windows — compatibility (non-blocking)
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest
