[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vitaminbot"
version = "0.1.0"
description = "VitaminBot MVP application skeleton"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "python-telegram-bot>=22.8,<23",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
vitaminbot-migrate = "vitaminbot.persistence.migrations:main"
vitaminbot-bot = "vitaminbot.telegram.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vitaminbot.persistence.sql" = ["*.sql"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
